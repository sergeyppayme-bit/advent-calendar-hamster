<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#F4EEDD" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
<title>Адвент-календарь</title>
<script>
(function () {
  var CURRENT_VERSION = "1789373257";
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.v && String(data.v) !== CURRENT_VERSION) {
        var url = new URL(location.href);
        url.searchParams.set('v', data.v);
        location.replace(url.toString());
      }
    })
    .catch(function () {});
})();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yellowtail&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap');

  * { box-sizing: border-box; }
  html {
    background: #F4EEDD;
  }
  html, body {
    margin: 0;
    min-height: 100vh;
    background-image:
      linear-gradient(180deg, rgba(18,26,40,0.45) 0%, rgba(244,238,221,0.55) 55%, rgba(244,238,221,0.88) 100%),
      url('background.jpg');
    background-size: cover;
    background-position: top center;
    background-repeat: no-repeat;
    background-color: #F4EEDD;
    font-family: 'Work Sans', sans-serif;
    color: #33403E;
  }
  .advent-app {
    position: relative;
    min-height: 100vh;
    width: 100%;
    overflow: hidden;
    padding: calc(32px + env(safe-area-inset-top)) 16px 60px;
  }

  .snow-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .snowflake {
    position: absolute; top: -10px; border-radius: 50%;
    background: rgba(201, 162, 39, 0.45);
    animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-10px) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(110vh) translateX(18px); opacity: 0.15; }
  }

  .header {
    position: relative; z-index: 2; text-align: center; max-width: 480px; margin: 0 auto 32px;
    padding: 30px 20px;
    background: radial-gradient(ellipse 75% 85% at 50% 50%, rgba(255,253,246,0.65) 0%, rgba(255,253,246,0.28) 55%, rgba(255,253,246,0) 80%);
  }

  .title {
    font-family: 'Yellowtail', cursive; font-weight: 400; font-size: clamp(38px, 9vw, 52px);
    margin: 0 0 6px; color: #275C58;
    text-shadow: 0 0 22px rgba(255,253,246,1), 0 0 10px rgba(255,253,246,1), 0 2px 4px rgba(255,253,246,0.9);
  }
  .subtitle {
    font-size: 14px; color: #33403E; margin: 0 0 18px; line-height: 1.5;
    text-shadow: 0 0 14px rgba(255,253,246,1), 0 0 6px rgba(255,253,246,1);
  }
  .dev-toggle {
    display: block;
    margin: 28px auto 0;
    background: none; border: none;
    color: rgba(51,64,62,0.4);
    font-size: 11px; font-family: 'Work Sans', sans-serif;
    text-decoration: underline; text-underline-offset: 3px;
    cursor: pointer; padding: 8px;
  }

  .grid {
    position: relative; z-index: 2; max-width: 640px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-flow: dense; gap: 12px;
  }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 9px; } }

  .door-cell { perspective: 1000px; aspect-ratio: 1 / 1; }
  .door-cell.featured { grid-column: span 2; grid-row: span 2; }
  .door-cell.wide { grid-column: span 2; grid-row: span 1; aspect-ratio: 2 / 1; }

  .door {
    position: relative; width: 100%; height: 100%; min-height: 64px;
    border-radius: 14px; cursor: pointer; background: transparent; border: none;
    padding: 0; font: inherit; color: #2F6F6B; -webkit-tap-highlight-color: transparent;
  }

  .door-peek {
    position: absolute; inset: 0; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; box-shadow: inset 0 1px 3px rgba(43,64,62,0.12);
    background: linear-gradient(155deg, #F7EFDB 0%, #EFE4C8 100%);
    color: rgba(47,111,107,0.5);
    transform: scale(0.8); opacity: 0.7;
    transition: transform 0.4s ease 0.22s, opacity 0.4s ease 0.22s;
  }
  .door.flip .door-peek, .door.opened .door-peek { transform: scale(1); opacity: 1; }
  .door-cell.featured .door-peek { font-size: 30px; }

  .door-flap {
    position: absolute; inset: 0; border-radius: 14px;
    background: linear-gradient(155deg, #FBF6E8 0%, #F0E7CE 55%, #EAE0C4 100%);
    border: 1.5px dashed rgba(47,111,107,0.3);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 1px 3px 7px rgba(43,64,62,0.14);
    transform-origin: left center;
    backface-visibility: hidden;
  }
  .door-photo {
    width: 76%; height: 76%; border-radius: 10px;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    background-color: #F0E7CE;
    box-shadow: inset 0 0 0 1px rgba(255,253,246,0.6), 0 1px 5px rgba(43,64,62,0.22);
  }
  .door-flap::before {
    content: ''; position: absolute; top: -1px; right: 9px; width: 13px; height: 8px;
    background: linear-gradient(135deg, transparent 50%, rgba(201,162,39,0.55) 50%);
    border-radius: 0 0 3px 0;
  }
  .door.locked .door-flap { filter: brightness(0.9) saturate(0.85); }
  @keyframes doorOpen {
    0%   { transform: rotateY(0deg) scale(1); }
    55%  { transform: rotateY(-126deg) scale(1.05); }
    78%  { transform: rotateY(-98deg) scale(0.97); }
    100% { transform: rotateY(-108deg) scale(1); }
  }
  .door.flip .door-flap {
    animation: doorOpen 0.75s cubic-bezier(.25,.85,.35,1) forwards;
    box-shadow: 12px 5px 20px rgba(43,64,62,0.3);
  }
  .door.opened .door-flap {
    transform: rotateY(-108deg);
    box-shadow: 12px 5px 20px rgba(43,64,62,0.3);
  }
  .door.shake .door-flap { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }
  .door-number-badge {
    position: absolute; z-index: 2;
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 28px; padding: 0 7px;
    background: rgba(255,253,246,0.95); border-radius: 999px;
    box-shadow: 0 2px 6px rgba(20,26,24,0.3);
  }
  .door-number-badge.badge-tl { top: 5px; left: 5px; }
  .door-number-badge.badge-tr { top: 5px; right: 5px; }
  .door-number-badge.badge-bl { bottom: 5px; left: 5px; }
  .door-number-badge.badge-br { bottom: 5px; right: 5px; }
  .door-cell.featured .door-number-badge { min-width: 38px; height: 38px; }
  .door-cell.featured .badge-tl, .door-cell.featured .badge-tr { top: 8px; }
  .door-cell.featured .badge-bl, .door-cell.featured .badge-br { bottom: 8px; }
  .door-cell.featured .badge-tl, .door-cell.featured .badge-bl { left: 8px; }
  .door-cell.featured .badge-tr, .door-cell.featured .badge-br { right: 8px; }
  .door-number { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; color: #275C58; }
  .door-cell.featured .door-number { font-size: 22px; }
  .door-glow {
    position: absolute; bottom: 6px; right: 8px;
    width: 6px; height: 6px; border-radius: 50%; background: #C9A227;
    box-shadow: 0 0 8px 2px rgba(201,162,39,0.6);
  }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(43, 64, 62, 0.45); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; z-index: 10; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    width: 100%; max-width: 360px; background: #FFFDF6;
    border: 1px solid rgba(201,162,39,0.35); border-radius: 18px; padding: 28px 22px;
    text-align: center; position: relative; box-shadow: 0 20px 40px rgba(43,64,62,0.18);
  }
  .close-btn {
    position: absolute; top: 14px; right: 14px; background: rgba(47,111,107,0.1); border: none;
    color: #2F6F6B; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px;
  }
  .media-placeholder {
    width: 100%; aspect-ratio: 4/3; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 16px; font-size: 40px;
  }
  .modal-day { font-family: 'Fraunces', serif; font-size: 15px; color: #C9A227; margin-bottom: 8px; }
  .modal-caption { font-size: 16px; line-height: 1.55; margin: 0; color: #33403E; }

  .toast-backdrop {
    position: fixed; inset: 0; z-index: 19;
    background: rgba(43,64,62,0.32);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .toast-backdrop.show { opacity: 1; }

  .toast {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    max-width: 320px; width: calc(100% - 64px);
    background: #FFFDF6; border: 1px solid rgba(201,162,39,0.4);
    color: #33403E; font-size: 15px; line-height: 1.6; text-align: center;
    padding: 22px 22px; border-radius: 18px; box-shadow: 0 20px 40px rgba(43,64,62,0.3);
    opacity: 0; pointer-events: none; z-index: 20;
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(.34,1.4,.4,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<div class="advent-app">
  <div class="snow-layer" id="snowLayer"></div>

  <div class="header">
    <h1 class="title">Адвент-календарь</h1>
    <p class="subtitle" id="progressText">Открыто 0 из 25 · коснись окошка своего дня</p>
  </div>

  <div class="grid" id="grid"></div>

  <button class="dev-toggle" id="demoToggle">режим предпросмотра</button>
</div>

<div class="toast-backdrop" id="toastBackdrop"></div>
<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card" id="modalCard">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="modal-day" id="modalDay"></div>
    <div class="media-placeholder" id="modalMedia" style="display:none;"></div>
    <p class="modal-caption" id="modalCaption"></p>
  </div>
</div>

<script>
/*
  КАК ЗАМЕНИТЬ НА РЕАЛЬНЫЙ КОНТЕНТ:
  Ниже в массиве SURPRISES у каждого дня меняй:
    type: "photo" | "video" | "text"
    caption: подпись/сообщение (для text — это сам текст сюрприза)
    mediaUrl: путь к файлу для photo/video (например "media/day5.jpg" —
      создай папку media/ рядом с этим index.html и положи туда файлы)
  Кнопка "Предпросмотр" вверху открывает все окошки для проверки —
  выключи её (или удали переменную demoMode = true ниже), чтобы окошки
  открывались только в свой день по календарю.
*/

const FESTIVE = [
  { title: "Классика", subtitle: "Потому что коты всегда в тренде", corner: "bl" },
  { title: "Сюрприз внутри", subtitle: "Интрига каждый день", corner: "bl" },
  { title: "Двойное счастье", subtitle: "Лучшие подарки — вместе", corner: "bl" },
  { title: "Новогодний образ", subtitle: "Даже коты верят в чудеса", corner: "tl" },
  { title: "Помощник Санты", subtitle: "Проверяет гирлянду на прочность", corner: "bl" },
  { title: "Окошко", subtitle: "Загляни, кто там?", corner: "bl" },
  { title: "Кот в коробке", subtitle: "Иногда самое простое — самое лучшее", corner: "tl" },
  { title: "В тёплом носке", subtitle: "Маленькие радости в больших деталях", corner: "tl" },
  { title: "Готовы к приключениям", subtitle: "В любой день, в любую погоду", corner: "bl" },
  { title: "Любопытный исследователь", subtitle: "Всё под контролем! (почти)", corner: "bl" },
  { title: "Кофейное настроение", subtitle: "Для уютных дней", corner: "bl" },
  { title: "В путь за чудесами", subtitle: "Новые истории каждый день", corner: "bl" },
];

function festiveFor(day) {
  return FESTIVE[(day - 1) % FESTIVE.length];
}

function buildSurprises() {
  return Array.from({ length: 25 }, (_, i) => {
    const day = i + 1;
    const f = festiveFor(day);
    return { day, type: "photo", caption: `${f.title} — ${f.subtitle}`, mediaUrl: null };
  });
}

function getUnlockDate(day) {
  const now = new Date();
  let year = now.getFullYear();
  const dec25 = new Date(year, 11, 25, 23, 59, 59);
  if (now > dec25) year += 1;
  return new Date(year, 11, day);
}

function catUrlFor(day) {
  const idx = ((day - 1) % 12) + 1;
  return `cats/festive${String(idx).padStart(2, "0")}.jpg`;
}

const LOCKED_MESSAGES = [
  "🐹 Кто тут такой любопытный хомяк?! Рано-рано, держи лапки подальше от этого подарочка!",
  "🎁 Эй, хомяк, не жульничай! У каждого сюрприза свой день 😏",
  "👀 Я всё вижу, хомяк! Этот подарок пока не твой. Терпение, пушистик ❤️",
  "🐹 А лапки-то шустрые! Но этот подарок ещё под замочком 🔐",
  "😈 Попытка хомячьего взлома обнаружена! Возвращайся завтра.",
];
let lastMessageIndex = -1;

const toast = document.getElementById("toast");
const toastBackdrop = document.getElementById("toastBackdrop");
let toastTimeout = null;

function hideToast() {
  toast.classList.remove("show");
  toastBackdrop.classList.remove("show");
}

function showToast() {
  let idx = Math.floor(Math.random() * LOCKED_MESSAGES.length);
  if (LOCKED_MESSAGES.length > 1 && idx === lastMessageIndex) {
    idx = (idx + 1) % LOCKED_MESSAGES.length;
  }
  lastMessageIndex = idx;
  toast.textContent = LOCKED_MESSAGES[idx];
  toast.classList.add("show");
  toastBackdrop.classList.add("show");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(hideToast, 2600);
}

toastBackdrop.addEventListener("click", () => {
  clearTimeout(toastTimeout);
  hideToast();
});

const surprises = buildSurprises();
const openedDays = new Set();
let demoMode = false;

const grid = document.getElementById("grid");
const progressText = document.getElementById("progressText");
const demoToggle = document.getElementById("demoToggle");
const modalBackdrop = document.getElementById("modalBackdrop");
const modalDay = document.getElementById("modalDay");
const modalMedia = document.getElementById("modalMedia");
const modalCaption = document.getElementById("modalCaption");
const closeBtn = document.getElementById("closeBtn");

function isLocked(day) {
  return !demoMode && new Date() < getUnlockDate(day);
}

function updateProgress() {
  progressText.textContent = `Открыто ${openedDays.size} из 25 · коснись окошка своего дня`;
}

function openModal(day) {
  const s = surprises.find((x) => x.day === day);
  modalDay.textContent = `День ${s.day}`;
  modalCaption.textContent = s.caption;
  if (s.type === "text") {
    modalMedia.style.display = "none";
  } else {
    modalMedia.style.display = "flex";
    modalMedia.style.background = `#F0E7CE center / contain no-repeat url('${catUrlFor(s.day)}')`;
    modalMedia.textContent = "";
  }
  modalBackdrop.classList.add("open");
}

closeBtn.addEventListener("click", () => modalBackdrop.classList.remove("open"));
modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) modalBackdrop.classList.remove("open"); });

function renderGrid() {
  grid.innerHTML = "";
  surprises.forEach((s) => {
    const wide = s.day === 23 || s.day === 24;
    const featured = (s.day % 5 === 0 || s.day === 25) && !wide;
    const cell = document.createElement("div");
    cell.className = "door-cell" + (featured ? " featured" : "") + (wide ? " wide" : "");
    const tilt = ((s.day * 13) % 5) - 2; // -2..2deg, handmade paper feel
    cell.style.transform = `rotate(${tilt}deg)`;

    const btn = document.createElement("button");
    btn.type = "button";
    const opened = openedDays.has(s.day);
    const locked = isLocked(s.day);
    btn.className = "door" + (locked ? " locked" : "") + (opened ? " opened" : "");

    const catUrl = catUrlFor(s.day);
    const corner = festiveFor(s.day).corner;
    btn.innerHTML = `
      <div class="door-peek">
        🎄
        ${opened ? '<span class="door-glow"></span>' : ""}
      </div>
      <div class="door-flap">
        <div class="door-photo" style="background-image:url('${catUrl}')"></div>
        <span class="door-number-badge badge-${corner}"><span class="door-number">${s.day}</span></span>
      </div>
    `;

    btn.addEventListener("click", () => {
      if (isLocked(s.day)) {
        btn.classList.add("shake");
        setTimeout(() => btn.classList.remove("shake"), 400);
        showToast();
        return;
      }
      if (openedDays.has(s.day)) {
        openModal(s.day);
        return;
      }
      btn.classList.add("flip");
      setTimeout(() => {
        openedDays.add(s.day);
        updateProgress();
        openModal(s.day);
        renderGrid();
      }, 760);
    });

    cell.appendChild(btn);
    grid.appendChild(cell);
  });
}

demoToggle.addEventListener("click", () => {
  demoMode = !demoMode;
  demoToggle.textContent = demoMode ? "все открыто (тест)" : "режим предпросмотра";
  renderGrid();
});

function renderSnow() {
  const layer = document.getElementById("snowLayer");
  for (let i = 0; i < 36; i++) {
    const f = document.createElement("div");
    f.className = "snowflake";
    const size = 3 + (i % 4);
    f.style.left = `${(i * 37) % 100}%`;
    f.style.width = size + "px";
    f.style.height = size + "px";
    f.style.animationDuration = `${8 + ((i * 13) % 10)}s`;
    f.style.animationDelay = `${(i * 0.37) % 8}s`;
    layer.appendChild(f);
  }
}

renderSnow();
renderGrid();
updateProgress();
</script>
</body>
</html>
